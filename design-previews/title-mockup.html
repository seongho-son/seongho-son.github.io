<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>타이틀 디자인 · 세 가지 시안</title>
<style>
:root{--ink:#353535;--muted:#777;--accent:#ac4c30;--brand:#c65735;--line:#e8e7e3;--wash:#f7f7f5;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);background:white}*{box-sizing:border-box}body{margin:0}button,summary{font:inherit;cursor:pointer}button{color:inherit}button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}a{color:inherit;text-decoration:none}.controls{padding:28px 24px 22px;border-bottom:1px solid var(--line)}h1{margin:0 0 10px;font-size:24px;letter-spacing:-.7px}.controls p{color:var(--muted);font-size:14px;line-height:1.8;margin:0}.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.tools button{background:white;border:1px solid var(--line);min-height:44px;padding:9px 14px;font-size:13px}.tools button[aria-pressed=true]{background:var(--ink);color:white}.gallery{max-width:1550px;padding:28px 24px;margin:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px}.proposal{min-width:0}.proposal h2{font-size:19px;letter-spacing:-.5px;margin:0 0 8px}.explain{color:var(--muted);font-size:13px;line-height:1.8;margin:0 0 18px;min-height:48px}.specimen{height:180px;background:var(--wash);display:flex;align-items:center;justify-content:center;margin-bottom:20px;overflow:hidden}.specimen .wordmark{font-size:36px}.frame{container-type:inline-size;max-width:390px;margin:auto;border:1px solid var(--line)}.site-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:22px 18px 16px;border-bottom:1px solid var(--line);align-items:center}.wordmark{font-weight:850;font-size:23px;letter-spacing:-1.2px;line-height:1.5;display:inline-flex;align-items:center;gap:.23em;white-space:nowrap;position:relative;isolation:isolate}.wordmark .lead{font-weight:750}.intro{font-size:11px;line-height:1.8;color:var(--muted);margin:8px 0 0;grid-column:1/-1}.menu{align-self:start;position:relative;z-index:5}.menu summary{font-size:11px;min-width:38px;min-height:44px;display:flex;align-items:center;justify-content:center;list-style:none;gap:5px}.menu summary::-webkit-details-marker{display:none}.hamburger{width:12px;height:8px;border-block:1px solid currentColor}.menu nav{position:absolute;right:0;top:100%;background:var(--wash);border:1px solid var(--line);width:150px;padding:8px 12px}.menu nav a{display:flex;align-items:center;min-height:44px;font-size:13px;border-bottom:1px solid var(--line)}.menu nav a:last-child{border:0}.preview{padding:24px 18px 28px}.category{font-size:11px;color:var(--accent);margin:0}.preview h3{font-size:21px;line-height:1.65;letter-spacing:-.5px;margin:10px 0 14px;word-break:keep-all}.byline{font-size:12px;color:var(--muted)}.jump{display:flex;justify-content:space-around;min-height:44px;align-items:center;border-block:1px solid var(--line);font-size:12px;margin:24px 0}.preview>p:last-child{font-size:14px;line-height:1.8;margin-bottom:0}.choose{min-height:44px;display:block;margin:18px 0 0 auto;padding:10px 16px;background:white;color:var(--accent);border:1px solid var(--accent);font-size:13px}.choose[aria-pressed=true]{background:var(--accent);color:white}
/* A: punchy word with just a single spark and curved underline */
.A .punch{color:var(--brand);font-weight:900;position:relative;display:inline-block;transform:rotate(-5deg);padding:0 .03em}.A .punch:after{content:'';position:absolute;left:0;right:0;bottom:0;height:.11em;background:var(--brand);border-radius:50%;transform:rotate(2deg);opacity:.25}.A .punch:before{content:'✦';font-size:.4em;position:absolute;right:-.45em;top:-.35em;color:var(--accent);font-weight:400}
/* B: word on a plate, with a little rising steam */
.B .wordmark{gap:.3em}.B .punch{color:var(--brand);position:relative;padding:0 .12em .1em;border-bottom:.07em solid var(--brand);border-radius:0 0 45% 45%;font-weight:850}.B .punch:after{content:'';position:absolute;height:.06em;border-radius:50%;background:var(--brand);bottom:-.18em;left:28%;right:28%}.steam{position:absolute;left:53%;top:-.42em;width:.15em;height:.32em;border-left:.045em solid var(--brand);border-radius:50%;transform:rotate(15deg)}.steam:after{content:'';position:absolute;left:.2em;top:-.07em;width:.13em;height:.3em;border-left:.045em solid var(--brand);border-radius:50%}.B .specimen .wordmark{font-size:34px}
/* C: rounded typographic seal */
.C .wordmark{gap:.32em}.C .lead{font-size:.92em;letter-spacing:-.06em}.C .punch{color:white;background:var(--brand);border-radius:.18em;padding:.02em .22em .06em;transform:rotate(-5deg);font-weight:900;line-height:1.35;box-shadow:.07em .07em 0 var(--ink)}.C .punch small{font-size:.6em;vertical-align:.15em;margin-left:.02em}.C .specimen .wordmark{font-size:35px}
footer{max-width:1500px;margin:0 auto;padding:16px 24px 36px;font-size:13px;color:var(--muted);line-height:1.8}.status{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;font-size:13px;padding:10px 16px;z-index:10;max-width:90%}.status:empty{display:none}body[data-view=desktop] .gallery{grid-template-columns:1fr;max-width:1050px}body[data-view=desktop] .frame{max-width:none}body[data-view=desktop] .specimen{height:150px}body[data-view=desktop] .explain{min-height:0}body[data-view=desktop] .proposal{margin-bottom:24px}
@container(min-width:650px){.site-head{padding:28px 32px 20px}.wordmark{font-size:30px}.intro{font-size:13px;margin-top:0}.menu summary{font-size:13px}.preview{max-width:740px;margin:auto;padding:30px 24px}.preview h3{font-size:27px}.jump{display:none}}
@container(max-width:330px){.site-head{padding-inline:14px;gap:5px}.wordmark{font-size:20px;letter-spacing:-1px}.menu summary{min-width:34px;font-size:10px}.intro{font-size:10px}.preview{padding-inline:14px}.C .wordmark{font-size:20px}}
@media(max-width:1050px){.gallery{grid-template-columns:1fr;max-width:650px}.specimen{height:170px}.explain{min-height:0}}@media(max-width:480px){.controls{padding:24px 16px}.gallery{padding:24px 12px;gap:36px}.specimen .wordmark,.B .specimen .wordmark,.C .specimen .wordmark{font-size:28px}.specimen{height:145px}.proposal h2{font-size:18px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style><body data-view="mobile"><header class="controls"><h1>‘나와라 뚝딱’에 작은 포인트</h1><p>현재 블로그명과 색은 유지하고, 글자에만 개성을 더한 세 가지 시안입니다.<br>위는 타이틀 확대, 아래는 실제 헤더 크기예요. 메뉴를 눌러 펼쳐볼 수 있습니다.</p><div class="tools"><button data-view="mobile" aria-pressed="true">모바일 비교</button><button data-view="desktop" aria-pressed="false">데스크톱</button></div></header><main class="gallery"></main><footer>A · 기울어진 ‘뚝딱’과 작은 반짝임 — 기존 타이틀에 가볍게 포인트<br>B · 접시와 김 모양 — 요리 블로그라는 인상을 더하기<br>C · 주황색 스탬프 — 작은 화면에서도 이름이 또렷하게<br>시안 선택 버튼은 비교용입니다. 마음에 드는 안이나 섞을 요소를 채팅으로 알려주세요.</footer><div class="status" role="status"></div>
<script>
const concepts=[['A','뚝딱, 한 번 강조','반짝임 하나와 살짝 기울인 글자. 이름의 장난기는 살리고 전체 헤더는 담백하게.'],['B','따뜻한 한 접시','뚝딱 아래에 접시 선, 위에 작은 김. 장식 자체가 요리를 떠올리게 하는 방향.'],['C','뚝딱 스탬프','뚝딱을 주황색 도장처럼. 검은 글자와 대비를 줘 모바일에서도 또렷하게.']];
function logo(id){return '<span class="wordmark" role="img" aria-label="레시피 나와라 뚝딱!"><span class="lead">레시피 나와라</span><span class="punch">뚝딱'+(id==='C'?'<small>!</small>':'!')+(id==='B'?'<i class="steam" aria-hidden="true"></i>':'')+'</span></span>'}
document.querySelector('.gallery').innerHTML=concepts.map(([id,name,desc])=>'<section class="proposal '+id+'" data-id="'+id+'"><h2>'+id+' · '+name+'</h2><p class="explain">'+desc+'</p><div class="specimen" aria-hidden="true">'+logo(id)+'</div><div class="frame"><header class="site-head"><a href="https://gibalpeople.com/" target="_blank" rel="noreferrer" aria-label="레시피 나와라 뚝딱 홈">'+logo(id)+'</a><details class="menu"><summary><span class="hamburger" aria-hidden="true"></span>메뉴</summary><nav aria-label="주 메뉴"><a href="https://gibalpeople.com/" target="_blank" rel="noreferrer">레시피 모음</a><a href="https://gibalpeople.com/?category=stew" target="_blank" rel="noreferrer">찌개</a><a href="https://gibalpeople.com/?category=stir-fry" target="_blank" rel="noreferrer">볶음</a><a href="https://gibalpeople.com/?category=side" target="_blank" rel="noreferrer">반찬</a></nav></details><p class="intro">다시 보고 싶은 유튜브 레시피, 여기에.</p></header><div class="preview"><p class="category">집밥 · 볶음</p><h3>1,000만 뷰 제육볶음, 내가 이걸로 정착한 이유</h3><p class="byline">참고 영상 · 킴서울</p><nav class="jump" aria-label="레시피 미리보기"><span>재료 준비 ⌄</span><span>만드는 순서 ⌄</span></nav><p>조회수 1,000만을 넘긴 제육볶음. 여러 레시피를 돌다 이걸로 정착했어요.</p></div></div><button class="choose" data-choice="'+id+'" aria-pressed="false">'+id+'안 선택</button></section>').join('');
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){document.body.dataset.view=b.dataset.view;document.querySelectorAll('.tools button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}if(b.dataset.choice){document.querySelectorAll('.choose').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('.status').textContent=b.dataset.choice+'안으로 표시했어요. 채팅으로 선택을 알려주세요.'}});
</script></body></html>
