<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>블로그 헤더 시안</title><style>
:root{--ink:#353535;--muted:#777;--accent:#ac4c30;--line:#e8e7e3;--wash:#f7f7f5;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);background:#fff}*{box-sizing:border-box}body{margin:0}button,a,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button{color:inherit}a{color:inherit;text-decoration:none}.controls{padding:26px 24px;border-bottom:1px solid var(--line)}h1{font-size:24px;margin:0 0 10px}.controls p{font-size:14px;color:var(--muted);line-height:1.7}.tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.tools button,.tools select{background:white;border:1px solid var(--line);padding:10px 14px;min-height:44px;font-size:13px}.tools button[aria-pressed=true]{background:var(--ink);color:white}.gallery{max-width:1550px;margin:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding:28px 24px}.proposal{min-width:0}.proposal>h2{font-size:18px;margin:0 0 8px}.explanation{font-size:13px;line-height:1.7;min-height:46px;margin:0 0 18px;color:var(--muted)}.frame{container-type:inline-size;border:1px solid var(--line);background:white;max-width:100%;margin:auto}.site-head{padding:24px 20px 0}.brand{display:block;font-size:25px;font-weight:800;letter-spacing:-1px;line-height:1.4;white-space:nowrap}.brand span{color:var(--accent)}.intro{font-size:12px;line-height:1.8;color:var(--muted);margin:8px 0 0;word-break:keep-all}.site-head button{border:0;background:transparent;min-height:44px;font-size:13px;padding:0}.menu-link{font-size:12px;color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center;min-height:44px;gap:8px}.menu-link:hover,.brand:hover{color:var(--accent)}.preview{padding:28px 20px 22px}.post{padding:0 0 24px;margin:0 0 24px;border-bottom:1px solid var(--line)}.category{font-size:11px;color:var(--accent)}.post h3{font-size:21px;line-height:1.6;letter-spacing:-.5px;word-break:keep-all;margin:10px 0}.post p{font-size:14px;line-height:1.8;margin:0;color:var(--muted)}.post button{border:0;background:none;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer}.detail-note{font-size:12px;color:var(--muted);padding:18px 0}.choose{display:block;margin:16px 0 24px auto;padding:10px 16px;min-height:44px;background:white;border:1px solid var(--accent);color:var(--accent);font-size:13px}.choose[aria-pressed=true]{background:var(--accent);color:white}
/* A: subtitle and return link share a row */
.A .subrow{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:3px 0 8px}.A .intro{margin:0;font-size:12px}.A .menu-link{font-size:12px}.A .preview{padding-top:24px}
/* B: centered masthead and useful category navigation */
.B .site-head{text-align:center;padding-top:30px}.B .intro{margin:6px 0 17px}.categories{display:flex;align-items:center;justify-content:center;gap:5px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 0}.B .categories button{padding:0 10px;min-height:40px;font-size:12px;border-radius:3px}.categories button[aria-pressed=true]{color:var(--accent);background:var(--wash);font-weight:700}.B .preview{padding-top:24px}
/* C: compact masthead and expandable navigation */
.C .site-head{padding-bottom:16px;border-bottom:1px solid var(--line)}.C .masthead{display:flex;align-items:center;justify-content:space-between;gap:12px}.C .brand{font-size:23px}.C .menu-toggle{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12px;flex:none;padding:0 2px}.menu-icon{display:inline-block;width:13px;height:8px;border-top:1px solid currentColor;border-bottom:1px solid currentColor}.C .intro{margin:3px 0 0;font-size:12px}.menu-panel{margin-top:14px;padding:8px 12px;background:var(--wash)}.menu-panel button{width:100%;text-align:left;border-bottom:1px solid var(--line)}.menu-panel button:last-child{border:0}.menu-panel[hidden]{display:none}.empty{font-size:14px;padding:24px 0;color:var(--muted)}footer{padding:16px 24px 40px;font-size:13px;line-height:1.8;color:var(--muted)}.status{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:10px 16px;font-size:13px;max-width:90%;z-index:5}.status:empty{display:none}body[data-size=mobile] .frame{max-width:390px}body[data-size=desktop] .gallery{grid-template-columns:1fr;max-width:1100px}body[data-size=desktop] .frame{max-width:1000px}body[data-size=desktop] .explanation{min-height:0}
@container(min-width:650px){.site-head{padding:30px 36px 0}.brand{font-size:30px}.preview{padding:30px 36px;max-width:760px;margin:auto}.A .site-head{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center;padding-bottom:22px;border-bottom:1px solid var(--line)}.A .subrow{border:0;padding:0;gap:22px}.A .intro{font-size:13px}.B .site-head{padding-top:30px}.B .categories{gap:20px}.C .site-head{padding:24px 36px 18px}.C .brand{font-size:29px}.C .intro{font-size:13px}.C .menu-panel{max-width:240px;margin-left:auto}.post h3{font-size:26px}}
@container(max-width:340px){.site-head,.preview{padding-left:16px;padding-right:16px}.brand{font-size:22px}.C .brand{font-size:20px}.A .subrow{gap:7px}.A .intro{font-size:11px}.A .menu-link{font-size:11px}.C .masthead{gap:5px}.C .intro{font-size:11px}.B .categories{gap:0}.B .categories button{padding-inline:8px}}
@media(max-width:1050px){.gallery{grid-template-columns:1fr;max-width:650px}}@media(max-width:480px){.gallery{padding:24px 10px}.controls{padding:22px 16px}.tools{gap:6px}.tools button{padding:9px 10px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style><body data-size="mobile"><header class="controls"><h1>소개 문구와 메뉴, 세 가지 방향</h1><p>브랜드 이름은 유지하고 소개의 길이와 메뉴 구조를 바꿨어요. 메뉴와 게시물 제목을 눌러 목록·상세 화면을 비교해보세요.</p><div class="tools"><button data-size="mobile" aria-pressed="true">모바일 390px</button><button data-size="desktop" aria-pressed="false">데스크톱</button><button id="reset">목록으로 초기화</button></div></header><main class="gallery"></main><footer>A · 소개 옆에 목록 링크를 붙여 높이 줄이기<br>B · 가운데 정렬한 제목 아래 요리 분류 메뉴<br>C · 메뉴를 접고 소개 한 줄만 남기기<br>분류 메뉴는 시안에서만 동작합니다. 선택한 안이나 섞을 요소를 채팅으로 알려주세요.</footer><div class="status" role="status"></div><script>
const recipes=[{"title":"백종원 떡볶이, 쌀떡이냐 밀떡이냐 고민이면 둘 다!","intro":"쌀떡파도 밀떡파도 양보할 필요 없겠네요. 떡 취향이 갈리는 집이라면 더 반가울 떡볶이예요.","category":"분식 · 떡볶이"},{"title":"백종원 계란찜, 뚜껑 덮기 전에 할 일이 있어요","intro":"식당에서 나오는 봉긋한 계란찜, 집에서도 그 모양이 나면 좋겠죠. 늘 납작하게 끝나서 아쉬웠다면 눈여겨볼 만해요.","category":"집밥 · 달걀"},{"title":"백종원 두부조림, 굽는 과정 빼니 한결 가볍네요","intro":"두부 한 모는 있는데 반찬 만들기는 귀찮고. 부치는 과정부터 부담스러웠다면 이 두부조림은 좀 반가울 거예요.","category":"집밥 · 두부"},{"title":"류수영 된장찌개, 된장 옆에 쌈장도 꺼내세요","intro":"된장찌개에 쌈장이라니, 고기 먹을 때만 꺼내던 통을 다시 보게 되네요. 류수영이 ‘평생 된장찌개’라고 이름 붙인 데도 눈길이 가요.","category":"집밥 · 찌개"},{"title":"백종원 닭볶음탕, 빨간 양념은 조금 뒤에 넣어요","intro":"닭볶음탕인데 시작은 안 빨갛다고요? 늘 한꺼번에 넣고 끓였다면 잠깐 멈칫할 백종원 레시피예요.","category":"집밥 · 닭요리"},{"title":"1,000만 뷰 제육볶음, 내가 이걸로 정착한 이유","intro":"조회수 1,000만을 넘긴 제육볶음. 여러 레시피를 돌다 이걸로 정착했어요.","category":"집밥 · 볶음"},{"title":"백종원 김치찌개 따라하기, 김치부터 볶는 줄 알았죠?","intro":"김치찌개 하면 김치부터 달달 볶는 장면이 떠오르죠. 그런데 백종원 영상은 시작부터 예상 밖이에요.","category":"집밥 · 찌개"}];
const names={A:['한 줄 소개 + 목록 링크','소개와 목록 링크를 한 줄로. 기존 탭이 차지하던 공간을 줄였습니다.'],B:['가운데 제목 + 요리 분류','한 개뿐인 메뉴 대신 전체·찌개·볶음·반찬을 탐색하는 방식입니다.'],C:['짧은 소개 + 접는 메뉴','소개는 한 줄만 남기고, 목록은 제목 옆 메뉴로 열어봅니다.']};
const state={A:{filter:'전체',detail:null},B:{filter:'전체',detail:null},C:{filter:'전체',detail:null}};
const brand='<a href="#" class="brand" data-home>레시피 나와라 <span>뚝딱!</span></a>';
function menu(){return ['전체','찌개','볶음','반찬'].map(x=>'<button data-filter="'+x+'">'+(x==='전체'?'레시피 모음':x)+'</button>').join('')}
function header(id){if(id==='A')return brand+'<div class="subrow"><p class="intro">영상으로 보고, 글로 꺼내보는 레시피.</p><a href="#" data-home class="menu-link">목록 <span aria-hidden="true">↗</span></a></div>';if(id==='B')return brand+'<p class="intro">유튜브에서 눈여겨본 레시피를 모았어요.</p><nav class="categories" aria-label="요리 분류">'+['전체','찌개','볶음','반찬'].map(x=>'<button data-filter="'+x+'" aria-pressed="'+(state[id].filter===x)+'">'+x+'</button>').join('')+'</nav>';return '<div class="masthead">'+brand+'<button class="menu-toggle" aria-expanded="false" aria-controls="menu-C"><span class="menu-icon" aria-hidden="true"></span>메뉴</button></div><p class="intro">다시 보고 싶은 유튜브 레시피, 여기에.</p><nav class="menu-panel" id="menu-C" hidden aria-label="주 메뉴">'+menu()+'</nav>'}
function matches(r,filter){if(filter==='전체')return true;if(filter==='찌개')return /찌개|탕/.test(r.category+r.title);if(filter==='볶음')return /제육|볶음/.test(r.title)&&!r.title.includes('닭볶음탕');return /두부조림|계란찜/.test(r.title)}
function content(id){const s=state[id];const items=s.detail===null?recipes.map((r,i)=>({...r,i})).filter(r=>matches(r,s.filter)): [{...recipes[s.detail],i:s.detail}];return items.slice(0,2).map(r=>'<article class="post"><span class="category">'+r.category+'</span><h3><button data-post="'+r.i+'">'+r.title+'</button></h3><p>'+r.intro+'</p>'+(s.detail!==null?'<div class="detail-note">게시물 상세 미리보기 · 상단 메뉴로 목록에 돌아갈 수 있어요.</div>':'')+'</article>').join('')||'<p class="empty">이 분류에 등록된 레시피가 없습니다.</p>'}
function render(){document.querySelector('.gallery').innerHTML=Object.entries(names).map(([id,[name,desc]])=>'<section class="proposal '+id+'" data-id="'+id+'"><h2>'+id+' · '+name+'</h2><p class="explanation">'+desc+'</p><div class="frame"><header class="site-head">'+header(id)+'</header><div class="preview">'+content(id)+'</div></div><button class="choose" data-choice="'+id+'">'+id+'안 선택</button></section>').join('')}
render();document.addEventListener('click',e=>{const t=e.target.closest('button,a');if(!t)return;const id=t.closest('.proposal')?.dataset.id;if(t.hasAttribute('data-home')){e.preventDefault();state[id]={filter:'전체',detail:null};render()}if(t.dataset.size){document.body.dataset.size=t.dataset.size;document.querySelectorAll('[data-size]').forEach(b=>{if(b.tagName==='BUTTON')b.setAttribute('aria-pressed',String(b.dataset.size===t.dataset.size))})}if(t.classList.contains('menu-toggle')){const expanded=t.getAttribute('aria-expanded')==='true';t.setAttribute('aria-expanded',String(!expanded));document.querySelector('#menu-C').hidden=expanded}if(t.dataset.filter){state[id]={filter:t.dataset.filter,detail:null};render()}if(t.dataset.post!==undefined){state[id].detail=Number(t.dataset.post);render()}if(t.id==='reset'){Object.keys(state).forEach(k=>state[k]={filter:'전체',detail:null});render()}if(t.dataset.choice){document.querySelectorAll('.choose').forEach(b=>b.setAttribute('aria-pressed',String(b===t)));document.querySelector('.status').textContent=t.dataset.choice+'안으로 표시했어요. 채팅으로 선택을 알려주세요.'}});
</script></body></html>
