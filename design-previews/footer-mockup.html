<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>푸터 · 데스크톱과 모바일 시안</title><style>
:root{--ink:#353535;--muted:#777;--accent:#ac4c30;--brand:#c65735;--line:#e8e7e3;--wash:#f7f7f5;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);background:white}*{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none}a:hover{color:var(--accent)}button,summary{font:inherit;cursor:pointer}a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.controls{padding:26px 28px 20px;border-bottom:1px solid var(--line)}h1{font-size:25px;margin:0 0 10px;letter-spacing:-.6px}.controls p{font-size:14px;line-height:1.8;color:var(--muted);margin:0}.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.tools button{background:white;border:1px solid var(--line);padding:10px 14px;min-height:44px;color:var(--ink);font-size:13px}.tools button[aria-pressed=true]{background:var(--ink);color:white}.gallery{padding:28px;max-width:1260px;margin:auto;display:grid;gap:40px}.proposal{min-width:0}.proposal-head{display:flex;align-items:start;gap:20px;justify-content:space-between;margin-bottom:16px}.proposal h2{font-size:20px;margin:0 0 8px;letter-spacing:-.5px}.explain{font-size:13px;line-height:1.8;color:var(--muted);margin:0}.choose{flex:none;min-height:44px;background:white;border:1px solid var(--accent);color:var(--accent);font-size:13px;padding:8px 14px}.choose[aria-pressed=true]{background:var(--accent);color:white}.frame{container-type:inline-size;width:100%;max-width:1160px;margin:auto;border:1px solid var(--line);background:white}.context{padding:24px 32px 28px;display:grid;grid-template-columns:minmax(0,760px) 1fr;gap:40px}.context p{font-size:13px;color:var(--muted);line-height:1.8;margin:0 0 12px}.context .context-label{font-size:11px;color:var(--accent)}.context a{font-size:13px;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}.context aside{font-size:12px;color:var(--muted);border-left:1px solid var(--line);padding-left:20px;align-self:start;line-height:1.8}.site-foot{border-top:1px solid var(--line);padding:28px 32px;color:var(--ink)}.brand{display:inline-flex;gap:.3em;align-items:center;font-size:20px;font-weight:800;letter-spacing:-.8px;line-height:1.4;white-space:nowrap}.dish{position:relative;color:var(--brand);padding:0 .12em .1em;border-bottom:.07em solid currentColor;border-radius:0 0 45% 45%}.dish:after{content:'';position:absolute;bottom:-.18em;left:28%;right:28%;height:.06em;background:currentColor;border-radius:50%}.steam{position:absolute;left:53%;top:-.42em;width:.15em;height:.32em;border-left:.045em solid currentColor;border-radius:50%;transform:rotate(15deg)}.steam:after{content:'';position:absolute;left:.2em;top:-.07em;width:.13em;height:.3em;border-left:.045em solid currentColor;border-radius:50%}.intro{font-size:12px;color:var(--muted);line-height:1.8;margin:9px 0 0}.links{display:flex;flex-wrap:wrap;gap:6px 22px}.links a{display:inline-flex;align-items:center;min-height:44px;font-size:12px}.up{border:0;background:transparent;color:var(--muted);padding:0 8px;min-width:44px;min-height:44px;font-size:12px;white-space:nowrap}.fine{color:var(--muted);font-size:11px;line-height:1.8}
/* A: compact left/right utility footer */
.A .site-foot{display:flex;align-items:center;justify-content:space-between;gap:24px}.A .right{display:flex;align-items:center;gap:24px}.A .links{gap:20px}.A .up{border-left:1px solid var(--line);padding-left:20px}
/* B: navigation directory with desktop columns */
.B .site-foot{background:var(--wash)}.directory{display:grid;grid-template-columns:1.7fr 1fr 1fr;gap:40px}.directory h3{font-size:12px;margin:0 0 10px;font-weight:600}.directory nav{display:grid;grid-template-columns:1fr 1fr;column-gap:20px;align-content:start}.directory nav a{display:flex;align-items:center;min-height:38px;font-size:13px}.directory .intro{max-width:240px}.foot-base{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px;margin-top:24px}.mobile-info{display:none}
/* C: another recipe first, then a quiet utility strip */
.C .site-foot{padding-top:0}.next-story{display:grid;grid-template-columns:1fr auto;align-items:center;gap:24px;padding:24px 0;border-bottom:1px solid var(--line)}.next-story .eyebrow{font-size:11px;color:var(--accent);display:block;margin-bottom:6px}.next-story strong{font-size:20px;line-height:1.6;font-weight:600;letter-spacing:-.4px;display:block;word-break:keep-all}.next-story .arrow{font-size:24px;color:var(--accent);padding:12px}.C .utility{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:18px}.C .brand{font-size:16px}.C .links{gap:18px}.C .brand-wrap .intro{margin-top:7px;font-size:11px}
.bottom{max-width:1200px;margin:auto;padding:0 28px 36px;font-size:13px;color:var(--muted);line-height:1.8}.status{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:10px 16px;background:var(--ink);color:white;font-size:13px;max-width:90%;z-index:5}.status:empty{display:none}body[data-view=mobile] .gallery{grid-template-columns:repeat(3,minmax(0,1fr));max-width:1320px;gap:24px}body[data-view=mobile] .frame{max-width:390px}body[data-view=mobile] .proposal-head{display:block}body[data-view=mobile] .choose{margin-top:12px}body[data-view=mobile] .explain{min-height:72px}
@container(max-width:640px){.context{padding:22px 20px;grid-template-columns:1fr;gap:0}.context aside{display:none}.site-foot{padding:24px 20px}.brand{font-size:19px}.A .site-foot{display:block}.A .right{justify-content:space-between;gap:8px;margin-top:16px}.A .links{gap:0 16px}.A .up{padding:0 0 0 12px}.A .intro{font-size:11px}.directory{grid-template-columns:1fr;gap:22px}.directory .intro{max-width:none;font-size:11px}.directory .info{display:none}.directory .browse nav{grid-template-columns:repeat(4,minmax(0,1fr));column-gap:4px}.directory h3{margin-bottom:6px}.directory nav a{font-size:12px;min-height:44px}.mobile-info{display:block;border-top:1px solid var(--line);margin-top:12px}.mobile-info summary{display:flex;align-items:center;justify-content:space-between;min-height:44px;font-size:12px;list-style:none}.mobile-info summary::-webkit-details-marker{display:none}.mobile-info summary:after{content:'+';font-size:17px}.mobile-info[open] summary:after{content:'−'}.mobile-info .links{gap:0 18px}.foot-base{margin-top:8px;padding-top:8px}.next-story{padding:22px 0;gap:10px}.next-story strong{font-size:17px}.next-story .arrow{padding:5px}.C .utility{display:block;padding-top:20px}.C .brand{font-size:18px}.C .links{margin-top:13px;gap:0 18px}.C .intro{font-size:11px}}
@container(max-width:340px){.site-foot{padding-inline:16px}.A .links{gap:0 12px}.links a{font-size:11px}.A .up{font-size:11px;padding-left:8px}.brand{font-size:18px}.intro{font-size:11px}.context{padding-inline:16px}}
@media(max-width:1050px){body[data-view=mobile] .gallery{grid-template-columns:1fr;max-width:650px}body[data-view=mobile] .explain{min-height:0}}@media(max-width:500px){.controls{padding:24px 16px}h1{font-size:22px}.gallery{padding:24px 10px;gap:32px}.proposal-head{display:block}.choose{margin-top:10px}.bottom{padding-inline:16px}.proposal h2{font-size:18px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.C .utility-links{display:flex;align-items:center;gap:22px}.C .utility-links .up{border-left:1px solid var(--line);padding-left:18px}@container(max-width:640px){.C .utility-links{margin-top:13px;justify-content:space-between;gap:8px}.C .utility-links .links{margin-top:0;gap:0 14px}.C .utility-links .up{padding-left:12px}}@container(max-width:340px){.C .utility-links .links{gap:0 10px}.C .utility-links .up{padding-left:8px;font-size:11px}}</style><body data-view="desktop"><header class="controls"><h1>푸터 시안 · 데스크톱부터 다시</h1><p>기본 화면은 실제 본문 최대 너비인 1,160px 기준입니다. 세 안을 세로로 배치해 데스크톱 구성을 온전히 보여드려요.<br>‘모바일 390px’을 누르면 각 안의 모바일 전용 배치로 바뀝니다.</p><div class="tools"><button data-view="desktop" aria-pressed="true">데스크톱 1,160px</button><button data-view="mobile" aria-pressed="false">모바일 390px</button></div></header><main class="gallery"></main><p class="bottom">링크는 실제 사이트로 새 탭에서 열립니다. B안은 모바일에서 ‘사이트 안내’를 펼칠 수 있어요.<br>선택한 안이나 섞을 요소를 채팅으로 알려주세요. 실제 사이트에는 아직 적용하지 않았습니다.</p><div class="status" role="status"></div>
<script>
const root='https://gibalpeople.com';
const brand='<a class="brand" href="'+root+'" target="_blank" rel="noreferrer">레시피 나와라 <span class="dish">뚝딱!<i class="steam" aria-hidden="true"></i></span></a>';
const intro='<p class="intro">다시 보고 싶은 유튜브 레시피, 여기에.</p>';
function links(){return '<nav class="links" aria-label="사이트 안내">'+[['소개','/about/'],['문의','/contact/'],['개인정보 안내','/privacy/'],['RSS','/rss.xml']].map(([n,p])=>'<a href="'+root+p+'" target="_blank" rel="noreferrer">'+n+'</a>').join('')+'</nav>'}
const up='<button class="up" aria-label="이 시안의 맨 위로">위로 ↑</button>';
const concepts=[['A','양쪽으로 나눈 간결형','데스크톱: 왼쪽 이름·오른쪽 안내 링크. 모바일: 이름 아래 링크를 두 줄 안으로 정리.'],['B','다시 찾기 좋은 탐색형','데스크톱: 이름 / 레시피 분류 / 사이트 안내, 3개 열. 모바일: 분류는 남기고 안내만 접기.'],['C','다음 글로 이어지는 마무리','데스크톱: 다음 레시피를 넓게 소개하고 아래에 작은 안내 줄. 모바일: 다음 글과 안내를 차례로.']];
function footer(id){if(id==='A')return '<div>'+brand+intro+'</div><div class="right">'+links()+up+'</div>';if(id==='B')return '<div class="directory"><div>'+brand+intro+'</div><section class="browse"><h3>레시피 둘러보기</h3><nav aria-label="레시피 분류">'+[['전체','/'],['찌개','/?category=stew'],['볶음','/?category=stir-fry'],['반찬','/?category=side']].map(([n,p])=>'<a href="'+root+p+'" target="_blank" rel="noreferrer">'+n+'</a>').join('')+'</nav></section><section class="info"><h3>사이트 안내</h3>'+links()+'</section></div><details class="mobile-info"><summary>사이트 안내</summary>'+links()+'</details><div class="foot-base"><span class="fine">레시피 나와라 뚝딱</span>'+up+'</div>';return '<a class="next-story" href="'+root+'/recipes/kimchi-jjigae/" target="_blank" rel="noreferrer"><span><span class="eyebrow">다음에 읽을 레시피 · 찌개</span><strong>백종원 김치찌개 따라하기, 김치부터 볶는 줄 알았죠?</strong></span><span class="arrow" aria-hidden="true">↗</span></a><div class="utility"><div class="brand-wrap">'+brand+intro+'</div><div class="utility-links">'+links()+'<button class="up" data-page-top aria-label="페이지 맨 위로">위로 ↑</button></div></div>'}
document.querySelector('.gallery').innerHTML=concepts.map(([id,name,desc])=>'<section class="proposal '+id+'" id="option-'+id+'"><div class="proposal-head"><div><h2>'+id+' · '+name+'</h2><p class="explain">'+desc+'</p></div><button class="choose" data-choice="'+id+'" aria-pressed="false">'+id+'안 선택</button></div><div class="frame"><div class="context"><div><p class="context-label">본문 끝부분 미리보기</p><p>참고 영상 · 킴서울</p><a href="'+root+'/" target="_blank" rel="noreferrer">← 레시피 모음으로</a></div><aside>1,000만 뷰 제육볶음,<br>내가 이걸로 정착한 이유</aside></div><footer class="site-foot">'+footer(id)+'</footer></div></section>').join('');
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){document.body.dataset.view=b.dataset.view;document.querySelectorAll('.tools button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}if(b.dataset.choice){document.querySelectorAll('.choose').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('.status').textContent=b.dataset.choice+'안으로 표시했어요. 채팅으로 선택을 알려주세요.'}if(b.classList.contains('up')){const behavior=matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth';if(b.hasAttribute('data-page-top'))window.scrollTo({top:0,behavior});else b.closest('.proposal').scrollIntoView({behavior,block:'start'})}});
</script></body></html>
